<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="src/styles/index.css" />
  </head>
  <body>
    <!-- Start Screen -->
    <div id="start-screen" class="screen start-screen active">
      <h1>Quiz Challenge</h1>
      <p>Test your web development knowledge!</p>
      <div class="theme-selector">
        <label class="theme-label">Theme</label>
        <div class="theme-options">
          <button class="theme-btn selected" data-theme="default" title="Classic"><span class="theme-swatch" style="background: #6c5ce7"></span>Classic</button>
          <button class="theme-btn" data-theme="ocean" title="Ocean"><span class="theme-swatch" style="background: #0984e3"></span>Ocean</button>
          <button class="theme-btn" data-theme="forest" title="Forest"><span class="theme-swatch" style="background: #00a86b"></span>Forest</button>
          <button class="theme-btn" data-theme="sunset" title="Sunset"><span class="theme-swatch" style="background: #e17055"></span>Sunset</button>
          <button class="theme-btn" data-theme="dark" title="Dark"><span class="theme-swatch" style="background: #a29bfe"></span>Dark</button>
        </div>
      </div>
      <div class="difficulty-selector">
        <label class="difficulty-label">Select Difficulty</label>
        <div class="difficulty-options">
          <button class="difficulty-btn" data-difficulty="easy">Easy<span class="difficulty-time">20s</span></button>
          <button class="difficulty-btn selected" data-difficulty="medium">Medium<span class="difficulty-time">15s</span></button>
          <button class="difficulty-btn" data-difficulty="hard">Hard<span class="difficulty-time">10s</span></button>
        </div>
      </div>
      <button id="start-btn" class="btn">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen quiz-screen">
      <div class="quiz-header">
        <span id="question-number">Question 1 / 10</span>
        <span id="timer-display" class="timer-display">15</span>
        <span id="score-display">Score: 0</span>
      </div>
      <div id="streak-display" class="streak-display" hidden>
        <span id="streak-text"></span>
      </div>
      <div id="timer-bar-container" class="timer-bar-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div class="question-card">
        <p id="question-text" class="question-text"></p>
        <div id="answers-container" class="answers-container"></div>
      </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="screen results-screen">
      <h2>Quiz Complete!</h2>
      <div class="results-grid">
        <div class="result-item">
          <div class="label">Score</div>
          <div id="final-score" class="value">0</div>
        </div>
        <div class="result-item">
          <div class="label">Accuracy</div>
          <div id="accuracy" class="value">0%</div>
        </div>
        <div class="result-item">
          <div class="label">Time</div>
          <div id="total-time" class="value">0s</div>
        </div>
      </div>
      <button id="restart-btn" class="btn">Play Again</button>
    </div>

    <script type="module" src="src/scripts/app.js"></script>
  </body>
</html>
